name: Build Android APK and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_DOCTOR: "1"
  CI: "1"

jobs:
  build-android:
    name: Build V A I R A A I signed APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate TypeScript
        run: pnpm run check

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install --non-interactive

      - name: Configure canonical release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"
          mkdir -p android/app/keystores
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystores/vaira-release.keystore
          test -s android/app/keystores/vaira-release.keystore
          chmod 600 android/app/keystores/vaira-release.keystore
          keytool -list -keystore android/app/keystores/vaira-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cat >> android/gradle.properties <<EOF
VAIRA_RELEASE_STORE_FILE=keystores/vaira-release.keystore
VAIRA_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
VAIRA_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
VAIRA_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
EOF
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          source = path.read_text()

          marker = "signingConfigs {"
          start = source.find(marker)
          if start < 0:
              raise SystemExit("Gradle signingConfigs block not found")

          depth = 0
          end = None
          for position in range(start + len(marker) - 1, len(source)):
              char = source[position]
              if char == "{":
                  depth += 1
              elif char == "}":
                  depth -= 1
                  if depth == 0:
                      end = position
                      break
          if end is None:
              raise SystemExit("Gradle signingConfigs block is not balanced")

          signing_block = source[start:end + 1]
          if "VAIRA_RELEASE_STORE_FILE" not in signing_block:
              release_config = """
              release {
                  storeFile file(project.findProperty("VAIRA_RELEASE_STORE_FILE"))
                  storePassword project.findProperty("VAIRA_RELEASE_STORE_PASSWORD")
                  keyAlias project.findProperty("VAIRA_RELEASE_KEY_ALIAS")
                  keyPassword project.findProperty("VAIRA_RELEASE_KEY_PASSWORD")
              }
          """
              source = source[:end] + release_config + source[end:]

          build_types = re.search(r"(?s)\bbuildTypes\s*\{", source)
          if not build_types:
              raise SystemExit("Gradle buildTypes block not found")

          release_match = re.search(r"(?s)\brelease\s*\{", source[build_types.start():])
          if not release_match:
              raise SystemExit("Gradle release buildType not found")
          release_start = build_types.start() + release_match.start()
          brace_start = source.find("{", release_start)
          depth = 0
          release_end = None
          for position in range(brace_start, len(source)):
              if source[position] == "{":
                  depth += 1
              elif source[position] == "}":
                  depth -= 1
                  if depth == 0:
                      release_end = position
                      break
          if release_end is None:
              raise SystemExit("Gradle release buildType is not balanced")

          release_body = source[brace_start + 1:release_end]
          release_body, replacements = re.subn(
              r"signingConfig\s+signingConfigs\.debug",
              "signingConfig signingConfigs.release",
              release_body,
              count=1,
          )
          if replacements == 0 and "signingConfigs.release" not in release_body:
              release_body = "\n            signingConfig signingConfigs.release" + release_body
          source = source[:brace_start + 1] + release_body + source[release_end:]
          path.write_text(source)
          PY

      - name: Build installable signed APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"

      - name: Prepare release asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/V A I R A A I-${VERSION}-android-release.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=release/V A I R A A I-${VERSION}-android-release.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaira-ai-android-release
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          name: V A I R A  A I ${{ github.ref_name }}
          body: |
            APK release V A I R A  A I bertanda tangan dengan identitas aplikasi kanonik:
            - Package Android: dev.andikune.vairaio

            Unduh APK pada bagian Assets, lalu pasang di Android. Pembaruan versi berikutnya akan menggunakan package dan keystore release yang sama.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
