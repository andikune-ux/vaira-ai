name: Build Native Android APK and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-native-release-${{ github.run_id }}
  cancel-in-progress: false

env:
  EXPO_NO_DOCTOR: "1"
  CI: "1"
  EXPO_PUBLIC_API_BASE_URL: https://vairaiapp-n9sw5cvx.manus.space
  EXPO_PUBLIC_OAUTH_PORTAL_URL: https://manus.im
  EXPO_PUBLIC_OAUTH_SERVER_URL: https://api.manus.im

jobs:
  build-android:
    name: Build V A I R A A I native Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/.*version: process.env.APP_VERSION ?? "\([^"]*\)".*/\1/p' app.config.ts | head -1)"
          fi
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate TypeScript and regressions
        run: |
          pnpm run check
          pnpm exec vitest run tests/aira-runtime-connection.test.ts tests/profile-donation-qr.test.ts tests/app-update-server.test.ts

      - name: Configure canonical release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"
          mkdir -p android/app/keystores
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystores/vaira-release.keystore
          test -s android/app/keystores/vaira-release.keystore
          chmod 600 android/app/keystores/vaira-release.keystore
          keytool -list -keystore android/app/keystores/vaira-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          keytool -certreq -keystore android/app/keystores/vaira-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" -file /tmp/vaira-release-verify.csr >/dev/null
          rm -f /tmp/vaira-release-verify.csr
          printf '\nVAIRA_RELEASE_STORE_FILE=keystores/vaira-release.keystore\n' >> android/gradle.properties
          python3 scripts/configure-android-signing.py

      - name: Build native release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # The canonical release keystore is PKCS12; Android requires the
          # private-key password to match the store password for this format.
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaira-ai-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check latest main revision
        id: latest-main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$LATEST_SHA" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "This build is not the latest main commit; keeping its artifact without replacing the latest release."
          fi

      - name: Publish latest APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && steps.latest-main.outputs.publish == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: android/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
          draft: false
          prerelease: false
          name: V A I R A  A I v${{ steps.release-version.outputs.version }}
          body: |
            APK native release V A I R A  A I.
            - Package Android: dev.andikune.vairaio
            - Build: native Gradle dari proyek Android yang tersimpan di repository.
            - Sumber update aplikasi: GitHub Releases.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
