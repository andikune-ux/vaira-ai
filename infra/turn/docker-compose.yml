services:
  aira-turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --realm=${AIRA_TURN_REALM}
      - --server-name=${AIRA_TURN_REALM}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --fingerprint
      - --lt-cred-mech
      - --user=${AIRA_TURN_USERNAME}:${AIRA_TURN_CREDENTIAL}
      - --min-port=49152
      - --max-port=65535
      - --no-cli
      - --no-multicast-peers
      - --no-loopback-peers
    environment:
      AIRA_TURN_REALM: ${AIRA_TURN_REALM}
      AIRA_TURN_USERNAME: ${AIRA_TURN_USERNAME}
      AIRA_TURN_CREDENTIAL: ${AIRA_TURN_CREDENTIAL}
